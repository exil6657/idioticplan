# Gradle Wrapper configuration for Zenith Client
# Gradle 9.4.0 is required by Fabric Loom 1.15 for Minecraft 26.1.x (per R001 research).
# Gradle JVM must be Java 25; mod source/target is Java 21 (see build.gradle).
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.4-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
