# Gradle properties for Zenith Client
# Researched values for Minecraft 26.1.2 / Fabric (R001 — COMPLETE):
#   - Loom 1.15 (unobfuscated mode — no remapping)
#   - Gradle 9.4.0
#   - Fabric Loader 0.18.4+
#   - Fabric API 0.145.4+26.1.2
#   - Gradle JVM: Java 25 (mod code itself is compiled to Java 21 class file version per master spec)
#   - Mojang official mappings only (Yarn no longer supported for 26.1+)
#   - Minecraft 26.1 is the first unobfuscated release — no remapJar needed.

org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.caching=true

# Mod metadata
mod_version=1.0.0
maven_group=com.zenith
archives_base_name=zenith-client

# Dependency versions (researched)
minecraft_version=26.1.2
loader_version=0.18.9
fabric_version=0.145.4+26.1.2
loom_version=1.15

# Bundled library versions (jar-in-jar)
jda_version=5.2.1
gson_version=2.10.1
slf4j_version=2.0.16
